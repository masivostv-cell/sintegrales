<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantalla del local</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b1030;
    --text: #f3eeff;
    --muted: #b3a6cf;
    --accent: #ffc43d;
    font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text); overflow: hidden; }
  body.idle, body.idle * { cursor: none !important; }

  .app { display: grid; grid-template-columns: 1fr 1fr; height: 100%; }
  @media (orientation: portrait) { .app { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
  /* Solo música: el video ocupa toda la pantalla */
  .app.solo { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  .app.solo #adHalf { display: none; }

  .half { position: relative; overflow: hidden; background: #000; }
  .layer { position: absolute; inset: 0; opacity: 0; }
  .layer iframe { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border: 0; transform-origin: 0 0; }
  .layer video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }

  /* Capa invisible: nadie pausa los videos tocando la pantalla */
  .shield { position: absolute; inset: 0; z-index: 5; }

  .status {
    position: absolute; inset: 0; z-index: 4;
    display: grid; place-items: center; padding: 2rem; text-align: center;
    font-size: clamp(1.1rem, 2.2vw, 1.8rem); font-weight: 800; color: var(--muted);
    background: radial-gradient(circle at 50% 40%, #31214f, var(--bg) 70%);
  }
  .status[hidden] { display: none; }

  #start {
    position: fixed; inset: 0; z-index: 10; width: 100%; border: 0;
    display: grid; place-items: center; align-content: center; gap: .6rem;
    background: rgba(27, 16, 48, .94); color: var(--text);
    font: inherit; font-size: clamp(1.6rem, 4vw, 3rem); font-weight: 800; cursor: pointer;
  }
  #start small { font-size: 1rem; font-weight: 600; color: var(--muted); }
  #start[hidden] { display: none; }

  /* ---------- Inicio de sesión de la pantalla ---------- */
  #login {
    position: fixed; inset: 0; z-index: 20;
    display: grid; place-items: center; padding: 1rem;
    background: radial-gradient(circle at 50% 35%, #31214f, var(--bg) 70%);
  }
  #login[hidden] { display: none; }
  .login-box { width: 100%; max-width: 380px; }
  .login-box h1 { margin: 0 0 .4rem; font-size: 1.8rem; font-weight: 800; }
  .login-box p { margin: 0 0 1.2rem; color: var(--muted); }
  .login-box p.error { color: #ff7a8a; }
  .login-box label { display: block; font-size: .9rem; color: var(--muted); margin: .7rem 0 .3rem; }
  .login-box input {
    width: 100%; padding: .65rem .8rem; font: inherit; color: var(--text);
    background: #26183f; border: 1px solid #432f6b; border-radius: 8px;
  }
  .lbtn {
    width: 100%; padding: .7rem; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer;
    border: 1px solid #432f6b; background: #31214f; color: var(--text);
  }
  .lbtn.primary { background: var(--accent); border-color: var(--accent); color: #2a1600; }
  .lbtn:focus-visible, .login-box input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sep { display: flex; align-items: center; gap: .7rem; color: var(--muted); font-size: .85rem; margin: 1.1rem 0 .2rem; }
  .sep::before, .sep::after { content: ""; flex: 1; height: 1px; background: #432f6b; }
  #btnMail { margin-top: 1rem; }
  .login-box { text-align: center; }
  #code {
    font-size: clamp(2.4rem, 7vw, 3.6rem); font-weight: 800; text-align: center;
    letter-spacing: .5em; padding: .5rem 0 .5rem .5em; margin-bottom: .2rem;
  }

  /* Barra de cuenta: aparece solo al mover el mouse */
  #account {
    position: fixed; top: .7rem; right: .7rem; z-index: 8;
    display: flex; align-items: center; gap: .6rem;
    padding: .45rem .5rem .45rem .8rem; border-radius: 10px;
    background: rgba(27, 16, 48, .9); border: 1px solid #432f6b; font-size: .9rem;
    transition: opacity .3s;
  }
  #account[hidden] { display: none; }
  body.idle #account { opacity: 0; pointer-events: none; }
  #account button {
    font: inherit; font-size: .85rem; color: var(--text); cursor: pointer;
    background: #31214f; border: 1px solid #432f6b; border-radius: 6px; padding: .3rem .6rem;
  }
  #start:focus-visible { outline: 3px solid var(--accent); outline-offset: -6px; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>
<div class="app" id="app">
  <section class="half" aria-label="Música">
    <div class="layer" id="L0"><div id="P0"></div></div>
    <div class="layer" id="L1"><div id="P1"></div></div>
    <div class="status" id="musicStatus">Conectando…</div>
    <div class="shield"></div>
  </section>
  <section class="half" id="adHalf" aria-label="Publicidad">
    <div class="layer" id="LA" style="opacity:1"><div id="AD"></div></div>
    <div class="layer" id="LV"><video id="adVideo" muted playsinline preload="auto"></video></div>
    <div class="status" id="adStatus">Conectando…</div>
    <div class="shield"></div>
  </section>
</div>

<div id="login" hidden>
  <form class="login-box" id="loginForm">
    <h1>Conectar pantalla</h1>
    <p id="loginMsg">Escribe el código de 4 números que aparece en el panel de control.</p>
    <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="Código de 4 números">
    <button class="lbtn primary" type="submit" id="btnMail">Conectar</button>
  </form>
</div>

<div id="account" hidden><span id="who"></span><button id="btnOut" type="button">Cambiar código</button></div>

<button id="start" hidden>Iniciar la música<small>El navegador necesita un clic para reproducir con sonido</small></button>

<script>
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  let doc = null; // apunta a los datos de la cuenta con la que se entró
  const $ = (id) => document.getElementById(id);
  const toList = (v) => (Array.isArray(v) ? v : Object.values(v || {})).filter(Boolean);

  // ---------- Estado ----------
  let playlist = [], ads = [], settings = { crossfade: 6, volume: 100, musicQuality: 'media', adQuality: 'baja' };
  let playlistLoaded = false;
  const players = [], ready = [false, false];
  let active = 0;          // reproductor que suena ahora (0 o 1)
  let current = null;      // canción actual
  let lastIndex = -1;      // posición de la canción actual en la lista
  let pending = null;      // canción cargando en el reproductor de reserva
  let queued = null;       // pedido que llegó durante un crossfade
  let fadeTimer = null, pendingTimeout = null;
  let started = false, autoTried = false, errorsInRow = 0;
  let adPlayer = null, adReady = false, adCurrent = null;

  const CF = () => Math.min(15, Math.max(0, Number(settings.crossfade) || 0));
  const VOL = () => Math.min(100, Math.max(0, Number(settings.volume ?? 100)));
  const L = [$('L0'), $('L1')];

  // ---------- Firebase ----------
  // ---------- Código de la pantalla ----------
  let signedUid = null; // aquí queda el código de 4 números
  const screenDoc = (code) => db.collection('pantallas').doc(code);
  const forget = () => { try { localStorage.removeItem('pantalla-codigo'); } catch (e) {} };

  function loginMsg(text, isError) {
    $('loginMsg').textContent = text;
    $('loginMsg').classList.toggle('error', !!isError);
  }
  function askCode(msg, isError) {
    $('login').hidden = false;
    $('account').hidden = true;
    $('musicStatus').textContent = 'Escribe el código para cargar tu música';
    $('adStatus').textContent = 'Escribe el código para cargar tu publicidad';
    if (msg) loginMsg(msg, isError);
    $('code').value = '';
    $('code').focus();
  }

  let connecting = false;
  async function connect(code) {
    if (connecting || signedUid) return; // evita conectar dos veces
    connecting = true;
    $('btnMail').disabled = true;
    try {
      const snap = await screenDoc(code).get();
      if (!snap.exists) { forget(); askCode('El código ' + code + ' no existe. Revísalo en el panel de control.', true); return; }
    } catch (e) {
      askCode('No hay conexión con Firebase. Revisa el internet y vuelve a intentar.', true);
      return;
    } finally { $('btnMail').disabled = false; connecting = false; }

    try { localStorage.setItem('pantalla-codigo', code); } catch (e) {}
    signedUid = code;
    $('login').hidden = true;
    $('account').hidden = false;
    $('who').textContent = 'Pantalla ' + code;
    // Si desde el panel cambian el código, esta pantalla vuelve a pedirlo
    screenDoc(code).onSnapshot((s) => { if (!s.exists) { forget(); location.reload(); } });
    startData(code);
  }

  $('code').addEventListener('input', () => {
    $('code').value = $('code').value.replace(/\D/g, '').slice(0, 4);
    if ($('code').value.length === 4) connect($('code').value); // conecta solo al poner el 4º número
  });
  $('loginForm').onsubmit = (e) => {
    e.preventDefault();
    const c = $('code').value;
    if (c.length !== 4) { loginMsg('El código tiene 4 números.', true); return; }
    connect(c);
  };
  $('btnOut').onclick = () => { forget(); location.reload(); };

  let savedCode = null;
  try { savedCode = localStorage.getItem('pantalla-codigo'); } catch (e) {}
  if (savedCode) connect(savedCode); else askCode();

  // ---------- Firebase (datos de esa pantalla) ----------
  function startData(code) {
    doc = (name) => screenDoc(code).collection('datos').doc(name);

    doc('playlist').onSnapshot((s) => {
      playlist = toList(s.data()?.items);
      playlistLoaded = true;
      if (current) {
        const i = playlist.findIndex((x) => x.uid === current.uid);
        if (i >= 0) lastIndex = i;
      }
      musicStatus();
      tryAuto();
      if (started && !current) playFirst();
    }, (e) => { $('musicStatus').textContent = 'Sin conexión con Firebase: ' + e.message; });

    doc('ads').onSnapshot((s) => {
      ads = toList(s.data()?.items);
      syncAds();
    });

    doc('settings').onSnapshot((s) => {
      settings = Object.assign({ crossfade: 6, volume: 100, musicQuality: 'media', adQuality: 'baja' }, s.data() || {});
      if (!fadeTimer && ready[active]) players[active].setVolume(VOL());
      applyLayout();
      applyLite();
      applyQuality();
    });

    let firstCommand = true;
    doc('command').onSnapshot((s) => {
      if (firstCommand) { firstCommand = false; return; } // ignora el pedido viejo al cargar
      const c = s.data();
      if (!c || !started) return;
      if (c.action === 'next') transitionTo(nextItem());
      if (c.action === 'play') {
        const it = playlist.find((x) => x.uid === c.uid);
        if (it) transitionTo(it);
      }
    });
  }

  // ---------- YouTube ----------
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);

  const baseVars = { controls: 0, rel: 0, playsinline: 1, modestbranding: 1, iv_load_policy: 3, disablekb: 1, fs: 0 };

  window.onYouTubeIframeAPIReady = () => {
    [0, 1].forEach((i) => {
      players[i] = new YT.Player('P' + i, {
        playerVars: { ...baseVars, autoplay: 0 },
        events: {
          onReady: () => { ready[i] = true; applyQuality(); tryAuto(); },
          onStateChange: (e) => onState(i, e.data),
          onError: () => onError(i)
        }
      });
    });

    adPlayer = new YT.Player('AD', {
      playerVars: { ...baseVars, autoplay: 1, mute: 1 },
      events: {
        onReady: (e) => { adReady = true; e.target.mute(); applyQuality(); syncAds(); },
        onStateChange: (e) => {
          e.target.mute();
          if (adCurrent?.type === 'mp4') return;
          if (e.data === YT.PlayerState.ENDED) nextAd();
          if (e.data === YT.PlayerState.PAUSED && !adsOff) e.target.playVideo();
        },
        onError: () => { if (adCurrent?.type !== 'mp4') setTimeout(nextAd, 1000); }
      }
    });
    // La publicidad siempre muda, pase lo que pase
    setInterval(() => { try { if (!adPlayer.isMuted()) adPlayer.mute(); } catch (e) {} }, 1500);
  };

  // ---------- Calidad (menos datos = menos pausas) ----------
  // YouTube elige la calidad según el tamaño del reproductor. Se dibuja pequeño
  // y se agranda con CSS: se ve un poco menos nítido pero gasta mucho menos internet.
  const QUALITY_WIDTH = { auto: 0, media: 854, baja: 640, minima: 426 };
  function fitIframe(layer, level) {
    const f = layer.querySelector('iframe');
    if (!f) return;
    const W = QUALITY_WIDTH[level] || 0;
    const box = layer.getBoundingClientRect();
    if (!W || box.width <= W) { f.style.width = '100%'; f.style.height = '100%'; f.style.transform = ''; return; }
    const k = box.width / W;
    f.style.width = W + 'px';
    f.style.height = (box.height / k) + 'px';
    f.style.transform = `scale(${k})`;
  }
  // ---------- Modo liviano (Fire TV y equipos lentos) ----------
  // Usa un solo reproductor: nunca hay dos videos de música cargando a la vez.
  const IS_SLOW_DEVICE = /Silk|AFT|AFTM|AFTT|AFTS|Fire TV/i.test(navigator.userAgent);
  const LITE = () => settings.lite === 'on' || (settings.lite !== 'off' && IS_SLOW_DEVICE);
  let wasLite = null;
  function applyLite() {
    const lite = LITE();
    if (lite === wasLite) return;
    wasLite = lite;
    if (lite) {
      clearPreload();
      try { players[1 - active].stopVideo(); } catch (e) {}
      L[1 - active].style.opacity = 0;
    }
  }

  function applyQuality() {
    const mq = LITE() ? 'minima' : settings.musicQuality;
    fitIframe(L[0], mq);
    fitIframe(L[1], mq);
    fitIframe($('LA'), settings.adQuality);
  }
  window.addEventListener('resize', applyQuality);

  // ---------- Publicidad ----------
  // Los videos MP4 se descargan completos una vez y luego se repiten sin usar internet
  const adVideo = $('adVideo');
  const blobCache = {};
  async function cachedUrl(url) {
    if (blobCache[url]) return blobCache[url];
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error(r.status);
      blobCache[url] = URL.createObjectURL(await r.blob());
      return blobCache[url];
    } catch (e) { return url; } // si no se puede guardar, se reproduce directo
  }
  adVideo.addEventListener('ended', () => nextAd());
  adVideo.addEventListener('error', () => setTimeout(nextAd, 1000));
  adVideo.addEventListener('volumechange', () => { adVideo.muted = true; });
  adVideo.addEventListener('pause', () => { if (!adsOff && adCurrent?.type === 'mp4' && !adVideo.ended) adVideo.play().catch(() => {}); });
  // Descarga por adelantado todas las publicidades MP4
  function precacheAds() { ads.filter((a) => a.type === 'mp4').forEach((a) => cachedUrl(a.url)); }

  // ---------- Con publicidad o solo música (se elige en el panel) ----------
  let adsOff = false;
  function applyLayout() {
    const off = settings.layout === 'music';
    if (off === adsOff) return;
    adsOff = off;
    $('app').classList.toggle('solo', off);
    if (off) {
      // la publicidad se detiene para no gastar internet
      try { adPlayer?.pauseVideo(); } catch (e) {}
      adVideo.pause();
    } else if (adCurrent) {
      playAd(adCurrent);
    } else {
      syncAds();
    }
    setTimeout(applyQuality, 50); // el video de música cambió de tamaño
  }

  function syncAds() {
    if (adsOff) return;
    if (!adReady) return;
    if (!signedUid) return;
    if (!ads.length) {
      adCurrent = null;
      adPlayer.stopVideo();
      adVideo.pause(); adVideo.removeAttribute('src');
      $('adStatus').textContent = 'Agrega videos de publicidad desde el panel de control';
      $('adStatus').hidden = false;
      return;
    }
    $('adStatus').hidden = true;
    precacheAds();
    if (adCurrent && ads.some((a) => a.uid === adCurrent.uid)) return; // sigue la que está
    playAd(ads[0]);
  }
  function nextAd() {
    if (!ads.length || adsOff) return;
    const i = ads.findIndex((a) => a.uid === adCurrent?.uid);
    playAd(ads[(i + 1) % ads.length]); // al final vuelve a la primera
  }
  async function playAd(a) {
    adCurrent = a;
    if (adsOff) return;
    if (a.type === 'mp4') {
      adPlayer.stopVideo();
      $('LA').style.opacity = 0;
      $('LV').style.opacity = 1;
      const src = await cachedUrl(a.url);
      if (adCurrent !== a) return;
      if (adVideo.src !== src) adVideo.src = src;
      adVideo.muted = true;
      adVideo.currentTime = 0;
      adVideo.play().catch(() => {});
    } else {
      adVideo.pause();
      $('LV').style.opacity = 0;
      $('LA').style.opacity = 1;
      adPlayer.mute();
      adPlayer.loadVideoById(a.id);
    }
  }

  // ---------- Música ----------
  function musicStatus() {
    const s = $('musicStatus');
    if (!playlist.length) { s.textContent = 'Agrega canciones desde el panel de control'; s.hidden = false; }
    else if (current) s.hidden = true;
    else { s.textContent = 'Preparando la música…'; s.hidden = false; }
  }

  function tryAuto() {
    if (autoTried || !ready[0] || !ready[1] || !playlistLoaded) return;
    autoTried = true;
    begin();
  }

  function begin() {
    started = true;
    $('start').hidden = true;
    if (!current) playFirst();
    else players[active].playVideo();
    checkPlaying();
  }

  // Si el navegador bloqueó el sonido, pide un clic
  function checkPlaying() {
    setTimeout(() => {
      if (!current) return;
      if (players[active].getPlayerState() !== YT.PlayerState.PLAYING) $('start').hidden = false;
    }, 4000);
  }

  function playFirst() {
    if (!playlist.length) { musicStatus(); return; }
    let i = 0;
    try {
      const saved = localStorage.getItem('pantalla-ultima-' + signedUid);
      const si = playlist.findIndex((x) => x.uid === saved);
      if (si >= 0) i = si;
    } catch (e) {}
    const p = players[active];
    current = playlist[i];
    lastIndex = i;
    p.unMute();
    p.setVolume(VOL());
    p.loadVideoById(current.id);
    L[active].style.opacity = 1;
    L[1 - active].style.opacity = 0;
    remember();
    musicStatus();
    checkPlaying();
  }

  function nextItem() {
    if (!playlist.length) return null;
    const i = playlist.findIndex((x) => x.uid === current?.uid);
    if (i < 0) return playlist[Math.max(0, lastIndex) % playlist.length]; // la actual la borraron
    return playlist[(i + 1) % playlist.length]; // al final vuelve a la primera
  }

  // Precarga: 40 s antes de terminar, la siguiente se carga en silencio y en pausa
  // para que ya tenga buffer cuando le toque
  const PRELOAD_SECONDS = 40;
  let preItem = null, preReady = false, preStarting = false;

  function preload(item) {
    if (!item) return;
    const s = 1 - active;
    preItem = item; preReady = false; preStarting = true;
    players[s].mute();
    players[s].setVolume(0);
    players[s].loadVideoById(item.id);
  }
  function clearPreload() { preItem = null; preReady = false; preStarting = false; }

  // Pasa a la siguiente en el reproductor de reserva; cuando arranca, empieza el crossfade
  // En modo liviano: baja el volumen, cambia de canción en el mismo reproductor y lo sube
  let liteFadeIn = false;
  function liteSwitch(item) {
    if (fadeTimer) { queued = item; return; }
    clearPreload();
    const p = players[active];
    const v = VOL();
    const dur = Math.max(0.3, Math.min(CF(), 4)) * 1000;
    const t0 = performance.now();
    pending = item;
    const finish = () => {
      clearInterval(fadeTimer);
      fadeTimer = null;
      p.setVolume(0);
      current = item;
      pending = null;
      lastIndex = playlist.findIndex((x) => x.uid === item.uid);
      liteFadeIn = true;
      p.loadVideoById(item.id);
      remember();
      musicStatus();
      if (queued) { const q = queued; queued = null; setTimeout(() => liteSwitch(q), 300); }
    };
    if (p.getPlayerState() === YT.PlayerState.ENDED || CF() === 0) { fadeTimer = 1; finish(); return; }
    fadeTimer = setInterval(() => {
      const k = Math.min(1, (performance.now() - t0) / dur);
      try { p.setVolume(Math.round(v * (1 - k))); } catch (e) {}
      if (k >= 1) finish();
    }, 100);
  }
  function liteRampUp() {
    liteFadeIn = false;
    const p = players[active], v = VOL(), t0 = performance.now();
    const h = setInterval(() => {
      const k = Math.min(1, (performance.now() - t0) / 1500);
      try { p.setVolume(Math.round(v * k)); } catch (e) {}
      if (k >= 1) clearInterval(h);
    }, 100);
  }

  function transitionTo(item) {
    if (!item) return;
    if (LITE()) { liteSwitch(item); return; }
    if (fadeTimer) { queued = item; return; }
    const s = 1 - active;
    pending = item;
    const wasPreloaded = preItem && preItem.uid === item.uid && preReady;
    clearPreload();
    players[s].unMute();
    players[s].setVolume(0);
    if (wasPreloaded) {
      players[s].seekTo(0, true);
      players[s].playVideo();
    } else {
      players[s].loadVideoById(item.id);
    }
    clearTimeout(pendingTimeout);
    pendingTimeout = setTimeout(() => { if (pending === item && !fadeTimer) onError(s); }, 12000);
  }

  function beginFade() {
    clearTimeout(pendingTimeout);
    const from = active, to = 1 - active;
    const ended = players[from].getPlayerState() === YT.PlayerState.ENDED;
    const dur = (ended ? 0.5 : Math.max(0.5, CF())) * 1000;
    const t0 = performance.now();
    L[to].style.zIndex = 2;
    L[from].style.zIndex = 1;
    fadeTimer = setInterval(() => {
      const k = Math.min(1, (performance.now() - t0) / dur);
      const v = VOL();
      try {
        players[from].setVolume(Math.round(v * (1 - k)));
        players[to].setVolume(Math.round(v * k));
      } catch (e) {}
      L[to].style.opacity = k;
      if (k >= 1) {
        clearInterval(fadeTimer);
        fadeTimer = null;
        players[from].stopVideo();
        L[from].style.opacity = 0;
        active = to;
        current = pending;
        pending = null;
        lastIndex = playlist.findIndex((x) => x.uid === current.uid);
        errorsInRow = 0;
        clearPreload();
        remember();
        musicStatus();
        if (queued) { const q = queued; queued = null; transitionTo(q); }
      }
    }, 50);
  }

  function onState(i, st) {
    const S = YT.PlayerState;
    // La precargada empezó a sonar en silencio: se pausa y sigue llenando el buffer
    if (i === 1 - active && preStarting && !pending && st === S.PLAYING) {
      players[i].pauseVideo();
      preStarting = false;
      preReady = true;
      return;
    }
    if (i === 1 - active && pending && st === S.PLAYING && !fadeTimer) beginFade();
    if (i !== active) return;
    if (st === S.ENDED && !pending) transitionTo(nextItem()); // sin crossfade o video corto
    if (st === S.PAUSED && started && !fadeTimer) players[i].playVideo(); // que nunca se pare
    if (st === S.PLAYING) {
      $('start').hidden = true;
      errorsInRow = 0;
      if (liteFadeIn) liteRampUp();
    }
  }

  function onError(i) {
    if (i === 1 - active && preItem && !pending) { clearPreload(); return; } // se resuelve al llegar su turno
    errorsInRow++;
    if (errorsInRow > playlist.length + 1) {
      $('musicStatus').textContent = 'Ningún video de la lista se puede reproducir. Revisa los enlaces en el panel.';
      $('musicStatus').hidden = false;
      return;
    }
    if (i === 1 - active && pending) {
      // la siguiente no se puede embeber: salta a la que viene después
      const bad = pending;
      pending = null;
      const idx = playlist.findIndex((x) => x.uid === bad.uid);
      setTimeout(() => transitionTo(playlist[(idx + 1) % playlist.length]), 500);
    } else if (i === active && !pending) {
      setTimeout(() => transitionTo(nextItem()), 500);
    }
  }

  // Precarga la siguiente y empieza el crossfade unos segundos antes de que termine
  setInterval(() => {
    if (!started || !current || pending || fadeTimer || !ready[active]) return;
    if (!LITE() && !ready[1 - active]) return;
    const p = players[active];
    if (p.getPlayerState() !== YT.PlayerState.PLAYING) return;
    const d = p.getDuration(), t = p.getCurrentTime();
    if (!(d > 0)) return;
    const left = d - t;
    const nxt = nextItem();
    if (LITE()) { // sin precarga, solo baja el volumen al final
      if (CF() > 0 && left <= Math.min(CF(), 4) + 0.5) transitionTo(nxt);
      return;
    }
    if (nxt && !preItem && left <= PRELOAD_SECONDS + CF() && left > CF() + 3) preload(nxt);
    if (preItem && nxt && preItem.uid !== nxt.uid) clearPreload(); // cambiaron la lista
    if (CF() > 0 && left <= CF() + 1) transitionTo(nxt);
  }, 250);

  function remember() {
    try { localStorage.setItem('pantalla-ultima-' + signedUid, current.uid); } catch (e) {}
  }

  // ---------- Pantalla ----------
  $('start').addEventListener('click', () => {
    document.documentElement.requestFullscreen?.().catch(() => {});
    begin();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'f' || e.key === 'F') {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    }
  });

  let idleTimer = setTimeout(() => document.body.classList.add('idle'), 5000);
  document.addEventListener('mousemove', () => {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
  });
</script>
</body>
</html>
