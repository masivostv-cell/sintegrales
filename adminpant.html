<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de la pantalla</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b1030;
    --surface: #26183f;
    --surface-2: #31214f;
    --line: #432f6b;
    --text: #f3eeff;
    --muted: #b3a6cf;
    --accent: #ffc43d;
    --accent-ink: #2a1600;
    --danger: #ff7a8a;
    font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 1.2rem 1rem 4rem; }
  header { display: flex; align-items: center; gap: .8rem; margin-bottom: 1.2rem; }
  h1 { flex: 1; margin: 0; font-size: 1.6rem; font-weight: 800; }
  .who { color: var(--muted); font-size: .9rem; }

  .btn {
    border: 1px solid var(--line); background: var(--surface-2);
    padding: .55rem .9rem; border-radius: 8px; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1rem; margin-bottom: 1rem; }
  .login { text-align: center; padding: 3rem 1rem; }
  .login p { color: var(--muted); }

  .controls { display: grid; grid-template-columns: auto 1fr 1fr; gap: 1rem 1.4rem; align-items: center; }
  @media (max-width: 600px) { .controls { grid-template-columns: 1fr; } }
  .slider label { display: flex; justify-content: space-between; font-size: .9rem; color: var(--muted); }
  .slider label b { color: var(--text); }
  .slider input { width: 100%; accent-color: var(--accent); }

  .tabs { display: flex; gap: .3rem; border-bottom: 1px solid var(--line); margin-bottom: 1rem; }
  .tabs button { background: none; border: 0; padding: .6rem .9rem; color: var(--muted); border-bottom: 3px solid transparent; font-weight: 600; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }

  textarea {
    width: 100%; min-height: 5.5rem; resize: vertical;
    padding: .7rem .8rem; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  }
  textarea::placeholder { color: var(--muted); }
  .add-row { display: flex; justify-content: space-between; align-items: center; gap: .8rem; margin-top: .6rem; }
  .hint { color: var(--muted); font-size: .85rem; }

  .list-head { display: flex; justify-content: space-between; align-items: center; margin: 1.2rem 0 .4rem; }
  .list-head h2 { margin: 0; font-size: 1.1rem; }
  ul { list-style: none; margin: 0; padding: 0; }
  .item { display: grid; grid-template-columns: 1.6rem 88px 1fr auto; gap: .7rem; align-items: center; padding: .5rem; border-radius: 8px; }
  .item:hover { background: var(--surface); }
  .num { color: var(--muted); font-size: .85rem; text-align: right; }
  .item img { width: 88px; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; background: var(--surface-2); }
  .meta { min-width: 0; }
  .title { font-weight: 600; font-size: .95rem; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .channel { color: var(--muted); font-size: .8rem; margin-top: .1rem; }
  .actions { display: flex; gap: .25rem; }
  .icon { width: 2.1rem; height: 2.1rem; display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; }
  .icon:hover:not(:disabled) { border-color: var(--accent); }
  .icon.del:hover { border-color: var(--danger); color: var(--danger); }
  .empty { color: var(--muted); padding: 1.5rem; text-align: center; }
  .toast { position: fixed; left: 50%; bottom: 1.2rem; transform: translateX(-50%); background: var(--accent); color: var(--accent-ink); padding: .6rem 1rem; border-radius: 8px; font-weight: 600; }
  @media (max-width: 520px) { .item { grid-template-columns: 1.2rem 64px 1fr; } .item img { width: 64px; } .actions { grid-column: 1 / -1; justify-content: flex-end; } }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Control de la pantalla</h1>
    <span class="who" id="who"></span>
    <button class="btn" id="btnOut" hidden>Cerrar sesión</button>
  </header>

  <div class="card login" id="login">
    <p id="loginMsg">Entra con tu cuenta de Google para manejar la música y la publicidad.</p>
    <button class="btn primary" id="btnIn">Entrar con Google</button>
  </div>

  <main id="app" hidden>
    <div class="card controls">
      <button class="btn primary" id="btnSkip">Saltar canción</button>
      <div class="slider">
        <label for="cf">Crossfade <b id="cfVal">6 s</b></label>
        <input type="range" id="cf" min="0" max="15" step="1" value="6">
      </div>
      <div class="slider">
        <label for="vol">Volumen de la música <b id="volVal">100</b></label>
        <input type="range" id="vol" min="0" max="100" step="5" value="100">
      </div>
    </div>

    <div class="tabs">
      <button data-tab="playlist" class="on">Música (<span id="cPlaylist">0</span>)</button>
      <button data-tab="ads">Publicidad (<span id="cAds">0</span>)</button>
    </div>

    <div class="card">
      <textarea id="links" placeholder="Pega uno o varios enlaces de YouTube, uno por línea"></textarea>
      <div class="add-row">
        <span class="hint" id="hint">Se agregan al final de la lista de música.</span>
        <button class="btn primary" id="btnAdd">Agregar</button>
      </div>
    </div>

    <div class="list-head">
      <h2 id="listTitle">Lista de música</h2>
      <button class="btn danger" id="btnClear">Vaciar lista</button>
    </div>
    <ul id="list"></ul>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const doc = (name) => db.collection('pantalla').doc(name);
  const auth = firebase.auth();
  const $ = (id) => document.getElementById(id);
  const toList = (v) => (Array.isArray(v) ? v : Object.values(v || {})).filter(Boolean);

  const lists = { playlist: [], ads: [] };
  let tab = 'playlist';
  let listening = false;

  // ---------- Sesión ----------
  $('btnIn').onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
    .catch((e) => { $('loginMsg').textContent = 'No se pudo entrar: ' + e.message; });
  $('btnOut').onclick = () => auth.signOut();

  auth.onAuthStateChanged((u) => {
    const ok = u && u.email === ADMIN_EMAIL;
    $('login').hidden = ok;
    $('app').hidden = !ok;
    $('btnOut').hidden = !u;
    $('who').textContent = u ? u.email : '';
    $('btnIn').hidden = !!u;
    if (u && !ok) $('loginMsg').textContent = 'Esta cuenta no tiene permiso. Entra con el correo del local.';
    if (ok && !listening) listen();
  });

  function listen() {
    listening = true;
    ['playlist', 'ads'].forEach((key) => {
      doc(key).onSnapshot((s) => {
        lists[key] = toList(s.data()?.items);
        $(key === 'playlist' ? 'cPlaylist' : 'cAds').textContent = lists[key].length;
        if (key === tab) render();
      }, (e) => toast('Sin acceso a Firestore: ' + e.message));
    });
    doc('settings').onSnapshot((s) => {
      const st = Object.assign({ crossfade: 6, volume: 100 }, s.data() || {});
      $('cf').value = st.crossfade; $('cfVal').textContent = st.crossfade + ' s';
      $('vol').value = st.volume; $('volVal').textContent = st.volume;
    });
  }

  const save = (key) => doc(key).set({ items: lists[key] }).catch((e) => toast('No se guardó: ' + e.message));
  const now = () => firebase.firestore.FieldValue.serverTimestamp();
  const setting = (data) => doc('settings').set(data, { merge: true }).catch((e) => toast('No se guardó: ' + e.message));

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(t._h); t._h = setTimeout(() => (t.hidden = true), 2500);
  }

  // ---------- Agregar enlaces ----------
  function extractIds(text) {
    const ids = [];
    for (const line of text.split(/\s+/)) {
      const m = line.match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/|live\/)([\w-]{11})/);
      if (m) ids.push(m[1]);
      else if (/^[\w-]{11}$/.test(line)) ids.push(line);
    }
    return ids;
  }

  async function info(id) {
    const url = encodeURIComponent('https://www.youtube.com/watch?v=' + id);
    try {
      const r = await fetch('https://www.youtube.com/oembed?format=json&url=' + url);
      if (r.ok) { const d = await r.json(); return { title: d.title, channel: d.author_name }; }
    } catch (e) {}
    try {
      const r = await fetch('https://noembed.com/embed?url=' + url);
      const d = await r.json();
      if (d.title) return { title: d.title, channel: d.author_name || '' };
    } catch (e) {}
    return { title: 'Video ' + id, channel: '' };
  }

  const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);

  $('btnAdd').onclick = async () => {
    const ids = extractIds($('links').value);
    if (!ids.length) { toast('No encontré enlaces de YouTube en el texto'); return; }
    $('btnAdd').disabled = true;
    $('btnAdd').textContent = 'Agregando…';
    const items = await Promise.all(ids.map(async (id) => ({ uid: uid(), id, ...(await info(id)) })));
    lists[tab].push(...items);
    await save(tab);
    $('links').value = '';
    $('btnAdd').disabled = false;
    $('btnAdd').textContent = 'Agregar';
    toast(items.length === 1 ? 'Agregado: ' + items[0].title : `Agregados ${items.length} videos`);
  };

  // ---------- Lista ----------
  function render() {
    const list = $('list');
    const arr = lists[tab];
    if (!arr.length) {
      list.innerHTML = `<li class="empty">${tab === 'playlist' ? 'La lista de música está vacía. Pega enlaces arriba para empezar.' : 'No hay videos de publicidad. Pega aquí los enlaces de tus videos.'}</li>`;
      return;
    }
    list.innerHTML = arr.map((v, i) => `
      <li class="item">
        <span class="num">${i + 1}</span>
        <img src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt="" loading="lazy">
        <div class="meta"><div class="title"></div><div class="channel"></div></div>
        <div class="actions">
          ${tab === 'playlist' ? `<button class="icon" data-a="play" data-i="${i}" title="Poner ahora">▶</button>` : ''}
          <button class="icon" data-a="up" data-i="${i}" title="Subir" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button class="icon" data-a="down" data-i="${i}" title="Bajar" ${i === arr.length - 1 ? 'disabled' : ''}>↓</button>
          <button class="icon del" data-a="del" data-i="${i}" title="Quitar">✕</button>
        </div>
      </li>`).join('');
    [...list.children].forEach((li, i) => {
      li.querySelector('.title').textContent = arr[i].title;
      li.querySelector('.channel').textContent = arr[i].channel || '';
    });
  }

  $('list').onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const i = +b.dataset.i, arr = lists[tab];
    if (b.dataset.a === 'play') {
      doc('command').set({ action: 'play', uid: arr[i].uid, ts: now() });
      toast('Poniendo: ' + arr[i].title);
      return;
    }
    if (b.dataset.a === 'up' && i > 0) [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]];
    if (b.dataset.a === 'down' && i < arr.length - 1) [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]];
    if (b.dataset.a === 'del') arr.splice(i, 1);
    save(tab);
  };

  $('btnClear').onclick = () => {
    const name = tab === 'playlist' ? 'la lista de música' : 'la publicidad';
    if (!confirm(`¿Vaciar ${name}? Esto no se puede deshacer.`)) return;
    lists[tab] = [];
    save(tab);
  };

  document.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => {
    tab = b.dataset.tab;
    document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
    $('listTitle').textContent = tab === 'playlist' ? 'Lista de música' : 'Videos de publicidad';
    $('hint').textContent = tab === 'playlist' ? 'Se agregan al final de la lista de música.' : 'Se agregan a la publicidad. Siempre suenan sin audio.';
    $('btnClear').textContent = 'Vaciar lista';
    render();
  });

  // ---------- Controles ----------
  $('btnSkip').onclick = () => {
    doc('command').set({ action: 'next', ts: now() });
    toast('Pasando a la siguiente');
  };
  $('cf').oninput = () => { $('cfVal').textContent = $('cf').value + ' s'; };
  $('cf').onchange = () => setting({ crossfade: +$('cf').value });
  $('vol').oninput = () => { $('volVal').textContent = $('vol').value; };
  $('vol').onchange = () => setting({ volume: +$('vol').value });
</script>
</body>
</html>
