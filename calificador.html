<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calificador de hojas de respuestas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --papel:#E9EFF6; --hoja:#FFFFFF; --tinta:#1D3557; --grafito:#3B4048; --suave:#6B7480;
  --linea:#D6DEE8; --rojo:#C0392B; --verde:#2E7D4F; --azul:#2F6FB3; --resalte:#E8F0FA;
  --radio:10px; color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{ --papel:#111821; --hoja:#1B222C; --tinta:#BFD4EE; --grafito:#E4E8EE; --suave:#98A2AF;
    --linea:#2E3846; --rojo:#F07467; --verde:#5FC08A; --azul:#7FB2EA; --resalte:#223247; color-scheme:dark; }
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--papel);color:var(--grafito);font:16px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:2px solid var(--tinta);background:var(--hoja)}
header.top h1{font-size:1.15rem;margin:0;color:var(--tinta);flex:1}
header.top .who{color:var(--suave);font-size:.9rem}
h2{color:var(--tinta);font-size:1.4rem;margin:8px 0 12px}
h3{color:var(--tinta);font-size:1.1rem;margin:0 0 8px}
.tabs{display:flex;gap:4px;margin:16px 0}
.tab{border:0;background:none;padding:8px 14px;font:inherit;color:var(--suave);border-bottom:3px solid transparent;cursor:pointer}
.tab.on{color:var(--tinta);border-color:var(--tinta);font-weight:700}
.panel{background:var(--hoja);border:1px solid var(--linea);border-radius:var(--radio);padding:16px;margin-bottom:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.row>*{flex:1 1 180px}
label.f{display:block;font-size:.9rem;color:var(--suave);margin-bottom:10px}
label.f>input,label.f>select,label.f>textarea{display:block;width:100%;margin-top:4px}
input,select,textarea{font:inherit;color:var(--grafito);background:var(--papel);border:1px solid var(--linea);border-radius:8px;padding:9px 10px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,.btn:focus-visible{outline:3px solid var(--azul);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:700;padding:9px 14px;border-radius:8px;border:1px solid var(--linea);background:var(--hoja);color:var(--tinta);cursor:pointer;text-decoration:none}
.btn.pri{background:var(--tinta);border-color:var(--tinta);color:var(--hoja)}
.btn.big{padding:14px 18px;font-size:1.05rem;width:100%}
.btn.peligro{color:var(--rojo)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.acciones{display:flex;gap:8px;flex-wrap:wrap}
.lista{list-style:none;margin:0;padding:0}
.lista li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--linea);cursor:pointer}
.lista li:last-child{border:0}
.lista .t{flex:1}
.lista .t b{color:var(--tinta);display:block}
.lista .t small{color:var(--suave)}
.vacio{color:var(--suave);padding:18px 4px}
.tabla{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--linea);white-space:nowrap}
th{color:var(--suave);font-weight:400;font-size:.85rem}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.ok{color:var(--verde)} .mal{color:var(--rojo)}
.estado{font-size:.85rem;color:var(--suave)}
.err{color:var(--rojo);margin:8px 0}
.aviso{background:var(--resalte);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:.95rem}
/* grilla de respuestas */
.grilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:2px 14px}
.preg{display:flex;align-items:center;gap:4px;padding:3px 0}
.preg .num{width:26px;text-align:right;color:var(--suave);font-size:.85rem;font-variant-numeric:tabular-nums;margin-right:4px}
.burb{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--suave);background:transparent;color:var(--suave);font:700 .78rem/1 inherit;cursor:pointer;padding:0}
.burb.on{background:var(--tinta);border-color:var(--tinta);color:var(--hoja)}
.burb.clave{box-shadow:0 0 0 2px var(--verde)}
.preg.bien .num{color:var(--verde);font-weight:700}
.preg.malo .num{color:var(--rojo);font-weight:700}
/* resultado */
.nota{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:6px 0 14px}
.sello{width:112px;height:112px;border:4px solid var(--rojo);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--rojo);transform:rotate(-6deg);flex:0 0 auto}
.sello b{font-size:2.1rem;line-height:1}
.sello span{font-size:.8rem}
.conteo{font-size:1.05rem}
.conteo b{font-size:1.5rem}
.foto img{max-width:100%;max-height:70vh;display:block;margin:10px auto;border-radius:6px;border:1px solid var(--linea)}
.estudiante{font-size:1.15rem;color:var(--tinta);font-weight:700;margin:4px 0}
.cargando{color:var(--suave);padding:10px 0}

/* fondo con figuras de educación */

@media print{body::before{display:none}}
header.top{background:color-mix(in srgb,var(--hoja) 92%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);position:sticky;top:0;z-index:5}
.panel{box-shadow:0 1px 2px rgba(29,53,87,.06),0 6px 20px rgba(29,53,87,.06)}
.login{max-width:440px;margin:0 auto;padding:10vh 16px 16px}
.login .marca{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.login .marca svg{flex:0 0 auto}
.login .marca h2{margin:0;line-height:1.2}
.login .marca p{margin:2px 0 0;color:var(--suave);font-size:.95rem}
.buscador{position:relative;margin-bottom:12px}
.buscador input{width:100%;font-size:1.05rem;padding:12px 12px 12px 40px}
.buscador .lupa{position:absolute;left:12px;top:13px;pointer-events:none;color:var(--suave)}
.sug{position:absolute;left:0;right:0;top:100%;z-index:10;margin:4px 0 0;padding:4px;list-style:none;background:var(--hoja);border:1px solid var(--linea);border-radius:10px;box-shadow:0 10px 28px rgba(29,53,87,.18);max-height:340px;overflow:auto}

.sug li.act,.sug li:hover{background:var(--resalte)}

.sug small{color:var(--suave);white-space:nowrap}
.sug small.hecho{color:var(--verde)}
.sug .nada{color:var(--suave);cursor:default}
.filtro{width:100%;max-width:360px;margin:0 0 10px}
.vista-hoja{max-width:430px;margin:6px auto 0;border:1px solid var(--linea);border-radius:6px;overflow:hidden;box-shadow:0 4px 14px rgba(29,53,87,.12);background:#fff}

  body{background:#fff}
  body>*:not(#printArea){display:none!important}

<script>
const OMR = (() => {
  const SHEET_W = 200, SHEET_H = 260, MARK = 8;
  // Orden: superior izq, superior der, inferior der, inferior izq
  const MARK_TL = [[4, 4], [188, 4], [188, 248], [4, 248]];
  const MARK_C = MARK_TL.map(([x, y]) => [x + MARK / 2, y + MARK / 2]);
  const ORIENT = { x: 16, y: 6, w: 22, h: 4 };
  const LETRAS = 'ABCDEFGH';

  function layoutV1(n, nOpt) {
    const cols = Math.max(1, Math.ceil(n / 25));
    const rows = Math.ceil(n / cols);
    const top = 66, bottom = 244, left = 12, right = 188;
    const rowH = Math.min(9, (bottom - top) / rows);
    const colW = (right - left) / cols;
    const optW = Math.min(8, (colW - 11) / nOpt);
    const r = Math.min(2.7, optW * 0.4, rowH * 0.38);
    const q = [];
    for (let i = 0; i < n; i++) {
      const c = Math.floor(i / rows), rr = i % rows;
      const x0 = left + c * colW, y = top + rr * rowH + rowH / 2;
      const opts = [];
      for (let o = 0; o < nOpt; o++) opts.push([x0 + 11 + o * optW + optW / 2, y]);
      q.push({ num: i + 1, numX: x0 + 8, y, opts });
    }
    return { cols, rows, rowH, colW, optW, r, top, left, q };
  }

  // Diseño 2: columnas de 10 preguntas mientras quepan, centradas en la hoja
  const GRID = { top: 79, bottom: 247, left: 12, right: 188, maxRows: 27 };
  function plan(n, nOpt) {
    const ancho = GRID.right - GRID.left;
    let maxCols = 1;
    for (let c = 1; c <= 8; c++) if ((ancho / c - 14) / nOpt >= 5.2) maxCols = c;
    let cols = Math.min(maxCols, Math.max(1, Math.ceil(n / 10)));
    cols = Math.min(maxCols, Math.max(cols, Math.ceil(n / GRID.maxRows)));
    return { cols, rows: Math.ceil(n / cols), maxCols };
  }
  const capacidad = nOpt => Math.min(100, plan(1, nOpt).maxCols * GRID.maxRows);
  function layout(n, nOpt, v) {
    if (v !== 2) return layoutV1(n, nOpt);
    const { cols, rows } = plan(n, nOpt), ancho = GRID.right - GRID.left;
    const rowH = Math.min(9.5, (GRID.bottom - GRID.top) / rows);
    const optW = Math.min(7.5, (ancho / cols - 14) / nOpt);
    const colW = 14 + nOpt * optW, left = GRID.left + (ancho - (cols * colW - 5)) / 2;
    const r = Math.min(2.7, optW * 0.4, rowH * 0.38);
    const q = [];
    for (let i = 0; i < n; i++) {
      const c = Math.floor(i / rows), rr = i % rows;
      const x0 = left + c * colW, y = GRID.top + rr * rowH + rowH / 2;
      const opts = [];
      for (let o = 0; o < nOpt; o++) opts.push([x0 + 9 + o * optW + optW / 2, y]);
      q.push({ num: i + 1, numX: x0 + 7, y, opts });
    }
    return { cols, rows, rowH, colW, optW, r, top: GRID.top, left, q };
  }

  function solve(A, b) {
    const n = b.length, M = A.map((row, i) => [...row, b[i]]);
    for (let c = 0; c < n; c++) {
      let p = c;
      for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
      [M[c], M[p]] = [M[p], M[c]];
      if (Math.abs(M[c][c]) < 1e-12) return null;
      for (let r = 0; r < n; r++) {
        if (r === c) continue;
        const f = M[r][c] / M[c][c];
        for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k];
      }
    }
    return M.map((row, i) => row[n] / row[i]);
  }

  function homography(src, dst) {
    const A = [], b = [];
    for (let i = 0; i < 4; i++) {
      const [x, y] = src[i], [u, v] = dst[i];
      A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
      A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v);
    }
    const h = solve(A, b);
    return h ? [...h, 1] : null;
  }

  function apply(H, x, y) {
    const w = H[6] * x + H[7] * y + 1;
    return [(H[0] * x + H[1] * y + H[2]) / w, (H[3] * x + H[4] * y + H[5]) / w];
  }

  function binarize(gray, W, H) {
    const W1 = W + 1, I = new Float64Array(W1 * (H + 1));
    for (let y = 0; y < H; y++) {
      let s = 0;
      for (let x = 0; x < W; x++) {
        s += gray[y * W + x];
        I[(y + 1) * W1 + x + 1] = I[y * W1 + x + 1] + s;
      }
    }
    const half = Math.max(8, Math.round(Math.max(W, H) / 18));
    const bin = new Uint8Array(W * H);
    for (let y = 0; y < H; y++) {
      const y0 = Math.max(0, y - half), y1 = Math.min(H, y + half + 1);
      for (let x = 0; x < W; x++) {
        const x0 = Math.max(0, x - half), x1 = Math.min(W, x + half + 1);
        const sum = I[y1 * W1 + x1] - I[y0 * W1 + x1] - I[y1 * W1 + x0] + I[y0 * W1 + x0];
        const mean = sum / ((x1 - x0) * (y1 - y0));
        bin[y * W + x] = gray[y * W + x] < mean * 0.75 ? 1 : 0;
      }
    }
    return bin;
  }

  function components(bin, W, H) {
    const lab = new Int32Array(W * H), stack = new Int32Array(W * H), comps = [];
    let id = 0;
    for (let p = 0; p < W * H; p++) {
      if (!bin[p] || lab[p]) continue;
      id++;
      let sp = 0; stack[sp++] = p; lab[p] = id;
      const c = { n: 0, minx: W, miny: H, maxx: 0, maxy: 0, sx: 0, sy: 0 };
      while (sp) {
        const q = stack[--sp], x = q % W, y = (q - x) / W;
        c.n++; c.sx += x; c.sy += y;
        if (x < c.minx) c.minx = x; if (x > c.maxx) c.maxx = x;
        if (y < c.miny) c.miny = y; if (y > c.maxy) c.maxy = y;
        if (x > 0 && bin[q - 1] && !lab[q - 1]) { lab[q - 1] = id; stack[sp++] = q - 1; }
        if (x < W - 1 && bin[q + 1] && !lab[q + 1]) { lab[q + 1] = id; stack[sp++] = q + 1; }
        if (y > 0 && bin[q - W] && !lab[q - W]) { lab[q - W] = id; stack[sp++] = q - W; }
        if (y < H - 1 && bin[q + W] && !lab[q + W]) { lab[q + W] = id; stack[sp++] = q + W; }
      }
      c.cx = c.sx / c.n; c.cy = c.sy / c.n;
      comps.push(c);
    }
    return comps;
  }

  function findMarkers(bin, W, H) {
    const m = Math.min(W, H), minS = m * 0.015, maxS = m * 0.12;
    const cands = components(bin, W, H).filter(c => {
      const w = c.maxx - c.minx + 1, h = c.maxy - c.miny + 1;
      if (w < minS || h < minS || w > maxS || h > maxS) return false;
      const ar = w / h;
      return ar > 0.6 && ar < 1.67 && c.n / (w * h) > 0.6;
    });
    const corners = [[0, 0], [W, 0], [W, H], [0, H]];
    const pts = corners.map(([X, Y]) => {
      let best = null, bd = Infinity;
      for (const c of cands) {
        const inQ = (X === 0 ? c.cx < W / 2 : c.cx >= W / 2) && (Y === 0 ? c.cy < H / 2 : c.cy >= H / 2);
        if (!inQ) continue;
        const d = Math.hypot(c.cx - X, c.cy - Y);
        if (d < bd) { bd = d; best = c; }
      }
      return best;
    });
    if (pts.some(p => !p)) return null;
    const areas = pts.map(p => p.n).sort((a, b) => a - b);
    const med = (areas[1] + areas[2]) / 2;
    if (pts.some(p => p.n < med * 0.35 || p.n > med * 2.8)) return null;

    for (let i = -st; i <= st; i++) for (let j = -st; j <= st; j++) {
      const dx = i / st * rad, dy = j / st * rad;
      if (dx * dx + dy * dy > rad * rad) continue;
      const [u, v] = apply(Hm, cx + dx, cy + dy);
      const x = Math.round(u), y = Math.round(v);
      t++;

  function sampleRect(bin, W, H, Hm, r) {
    let d = 0, t = 0;
    for (let i = 1; i < 12; i++) for (let j = 1; j < 4; j++) {
      const [u, v] = apply(Hm, r.x + r.w * i / 12, r.y + r.h * j / 4);
      const x = Math.round(u), y = Math.round(v);
      t++;
      if (x >= 0 && y >= 0 && x < W && y < H && bin[y * W + x]) d++;
    }

  }

  function decide(f) {
    const idx = f.map((v, i) => [v, i]).sort((a, b) => b[0] - a[0]);
    const m1 = idx[0][0], m2 = idx[1] ? idx[1][0] : 0;
    if (m1 < 0.3) return '';
    if (m2 >= 0.3 && m2 > m1 * 0.6) return '*';

  }

  // Código de formato (hoja universal): inicio + 7 bits preguntas + 3 bits opciones + 2 de control + fin
  const CODE = { y: 250.5, w: 3.6, h: 3, paso: 6, celdas: 14 };

    const b = [1];
    for (let i = 6; i >= 0; i--) b.push((N >> i) & 1);
    for (let i = 2; i >= 0; i--) b.push(((K - 1) >> i) & 1);
    const unos = b.slice(1).reduce((a, c) => a + c, 0);
    b.push(unos % 2, (N + K) % 2, 1);
    return b;
  }
  // Código v2 (varias hojas): inicio + 7 bits preguntas + 3 bits opciones + 8 bits primera pregunta + 2 control + fin
  const CODE2 = { y: 250.5, w: 2.8, h: 3, paso: 4.4, celdas: 22 };
  CODE2.x0 = 100 - CODE2.celdas * CODE2.paso / 2 + (CODE2.paso - CODE2.w) / 2;
  function codificar2(N, K, off) {
    const b = [1];
    for (let i = 6; i >= 0; i--) b.push((N >> i) & 1);
    for (let i = 2; i >= 0; i--) b.push(((K - 1) >> i) & 1);
    for (let i = 7; i >= 0; i--) b.push((off >> i) & 1);
    const unos = b.slice(1).reduce((a, c) => a + c, 0);
    b.push(unos % 2, (N + K + off) % 2, 1);

  }
  const celdas2 = () => Array.from({ length: CODE2.celdas }, (_, i) => ({ x: CODE2.x0 + i * CODE2.paso, y: CODE2.y, w: CODE2.w, h: CODE2.h }));

  }
  function celdasCodigo() {
    return Array.from({ length: CODE.celdas }, (_, i) => ({ x: CODE.x0 + i * CODE.paso, y: CODE.y, w: CODE.w, h: CODE.h }));
  }
  function decodificar(bin, W, H, Hm) {
    const b2 = celdas2().map(r => sampleRect(bin, W, H, Hm, r) > 0.5 ? 1 : 0);
    if (b2[0] === 1 && b2[21] === 1) {
      let N = 0, K = 0, off = 0;
      for (let i = 1; i <= 7; i++) N = N * 2 + b2[i];
      for (let i = 8; i <= 10; i++) K = K * 2 + b2[i];
      for (let i = 11; i <= 18; i++) off = off * 2 + b2[i];
      K += 1;
      if (N >= 1 && N <= 100 && K >= 2 && b2.join('') === codificar2(N, K, off).join('')) return { N, K, off };
    }
    const b = celdasCodigo().map(r => sampleRect(bin, W, H, Hm, r) > 0.5 ? 1 : 0);
    let N = 0, K = 0;
    for (let i = 1; i <= 7; i++) N = N * 2 + b[i];
    for (let i = 8; i <= 10; i++) K = K * 2 + b[i];
    K += 1;
    const ok = b[0] === 1 && b[13] === 1 && N >= 1 && N <= 100 && K >= 2 && b.join('') === codificar(N, K).join('');
    return ok ? { N, K, off: 0 } : null;
  }

  function read(gray, W, H, n, nOpt, v, opc = {}) {
    const bin = binarize(gray, W, H);
    const P = findMarkers(bin, W, H);
    if (!P) throw new Error('No se encontraron los cuatro cuadros negros de las esquinas. Tome la foto de frente, con la hoja completa y buena luz.');
    let best = null;
    for (let k = 0; k < 4; k++) {
      const dst = [0, 1, 2, 3].map(i => P[(i + k) % 4]);
      const Hm = homography(MARK_C, dst);
      if (!Hm) continue;
      const s = sampleRect(bin, W, H, Hm, ORIENT);
      if (!best || s > best.s) best = { Hm, s };
    }
    if (!best || best.s < 0.5) throw new Error('No se reconoce la hoja de respuestas. Verifique que sea una hoja impresa desde esta aplicación.');
    let formato = null;
    if (opc.auto) {
      formato = decodificar(bin, W, H, best.Hm) || opc.respaldo || null;
      if (!formato) throw new Error('No se pudo leer la franja de cuadritos de abajo de la hoja (indica qué hoja es). Tome la foto de nuevo con la hoja completa.');
      n = formato.N; nOpt = formato.K; v = 2;
    }
    const L = layout(n, nOpt, v);
    const fills = L.q.map(q => q.opts.map(([x, y]) => sampleFill(bin, W, H, best.Hm, x, y, L.r * 0.62)));
    if (!formato) formato = { N: n, K: nOpt, off: 0 };
    return { respuestas: fills.map(decide), fills, H: best.Hm, layout: L, markers: P, formato };
  }

  return { SHEET_W, SHEET_H, MARK, MARK_TL, MARK_C, ORIENT, LETRAS, layout, capacidad, paginas, codificar, celdasCodigo, codificar2, celdas2, homography, apply, read };
})();

function leerUniForm() {
  const opciones = parseInt($('#uOpt').value), cap = OMR.capacidad(opciones) * 3;
  return {
    colegio: $('#uColegio').value.trim(), opciones,
    preguntas: Math.max(5, Math.min(cap, parseInt($('#uPreg').value) || 50)),
    campos: [...document.querySelectorAll('.uCampo:checked')].map(x => x.value)
  };
}
function cfgUniImprimir() {
  if (esAdmin() && $('#uOpt')) return { ...uni(), ...leerUniForm() };
  const K = parseInt($('#tOpt')?.value) || uni().opciones, cap = OMR.capacidad(K) * 3;
  let N = Math.max(5, Math.min(cap, parseInt($('#tPreg')?.value) || uni().preguntas));
  if ($('#tPreg') && +$('#tPreg').value > cap) $('#tPreg').value = N;
  const nh = OMR.paginas(N, K).length;
  const c = $('#tCap'); if (c) c.textContent = `Con opciones hasta la ${L[K - 1]} caben ${OMR.capacidad(K)} preguntas por hoja (hasta ${cap} en 3 hojas).${nh > 1 ? ` Se imprimen ${nh} hojas por estudiante.` : ''}`;
  return { ...uni(), preguntas: N, opciones: K };
}
function hojasDePrueba(p, est) {
  if (p.hoja !== 'universal') {
    if (p.v !== 2) return [hojaSVGv1(p, est)];
    return OMR.paginas(p.n, p.nOpt).map(pg => hojaSVG(p, est, pg));
  }
  const vals = est ? { estudiante: `${est.apellido} ${est.nombre}`, codigo: est.codigo, curso: p.cursoNombre, materia: p.materia, docente: p.docente, prueba: p.nombre, periodo: p.periodo, fecha: fechaTxt(p.fecha) } : {};
  return hojasUniversal({ ...uni(), preguntas: p.n, opciones: p.nOpt }, vals);
}
async function leerHoja(file, p) {
  let r;
  if (p.hoja !== 'universal' && p.v !== 2) r = await leerFoto(file, p.n, p.nOpt, p.v);
  else {
    const unaHoja = p.hoja === 'universal' ? (p.uN ? { N: p.uN, K: p.uOpt, off: 0 } : null)
      : (OMR.paginas(p.n, p.nOpt).length === 1 ? { N: p.n, K: p.nOpt, off: 0 } : null);
    r = await leerFoto(file, p.n, p.nOpt, 2, { auto: true, respaldo: unaHoja });
  }
  const f = r.formato;
  if (f.off >= p.n) throw new Error(`Esta hoja empieza en la pregunta ${f.off + 1}, pero la prueba solo tiene ${p.n} preguntas.`);
  const c = Math.min(f.N, p.n - f.off);
  r.respuestas = r.respuestas.slice(0, c);
  r.fills = r.fills.slice(0, c);
  r.layout = { ...r.layout, q: r.layout.q.slice(0, c) };
  r.off = f.off; r.c = c;
  return r;
}

function filasAEstudiantes(rows) {
  rows = rows.filter(r => r && r.some(c => String(c ?? '').trim() !== ''));
  if (!rows.length) return [];
  let iC = 0, iA = 1, iN = 2, inicio = 0;
  const h = rows[0].map(norm);
  if (h.some(x => /cod|doc|ident|apell|nomb/.test(x))) {
    inicio = 1;
    iC = h.findIndex(x => /cod|doc|ident|tarjeta/.test(x));
    iA = h.findIndex(x => /apell/.test(x));
    iN = h.findIndex((x, i) => /nomb/.test(x) && i !== iA);
    if (iC < 0) iC = 0;
  } else if (rows[0].length === 2) { iA = -1; iN = 1; }
  const vistos = new Set(), out = [];
  for (const r of rows.slice(inicio)) {
    const codigo = String(r[iC] ?? '').trim().replace(/\.0$/, '');
    if (!codigo || vistos.has(codigo)) continue;
    vistos.add(codigo);
    out.push({ codigo, apellido: iA >= 0 ? String(r[iA] ?? '').trim() : '', nombre: iN >= 0 ? String(r[iN] ?? '').trim() : '' });
  }
  return out.sort((a, b) => (a.apellido + a.nombre).localeCompare(b.apellido + b.nombre, 'es'));
}

function grilla(n, nOpt, valores, accion, clave) {
  let h = `<div class="grilla" style="grid-template-columns:repeat(auto-fill,minmax(${40 + nOpt * 32}px,1fr))">`;
  for (let q = 0; q < n; q++) {
    const v = valores[q] || '', k = clave ? clave[q] : '';
    const cls = clave && k ? (v === k ? 'bien' : 'malo') : '';
    h += `<div class="preg ${cls}"><span class="num">${q + 1}</span>`;
    for (let o = 0; o < nOpt; o++) {
      const l = L[o];
      h += `<button class="burb ${v === l ? 'on' : ''} ${clave && k === l ? 'clave' : ''}" data-a="${accion}" data-q="${q}" data-l="${l}" aria-label="Pregunta ${q + 1}, opción ${l}">${l}</button>`;
    }
    h += `</div>`;
  }
  return h + '</div>';
}

function distancia(a, b, max) { // distancia de edición, corta si supera max

  return s + '</svg>';
}
function imprimir(modo) {
  const p = prueba(), est = curso(p.cursoId)?.estudiantes || [];
  const lista = modo === 'nombres' ? est : [null];
  $('#printArea').innerHTML = lista.map(e => hojasDePrueba(p, e).map(h => `<div class="pagina">${h}</div>`).join('')).join('');
  setTimeout(() => window.print(), 50);
}

/* ---------------- exportar ---------------- */
function exportar() {
  const p = prueba(), est = curso(p.cursoId)?.estudiantes || [];
  const filas = est.map(e => {
    const r = S.resultados[e.codigo];
    if (!r) return { 'Código': e.codigo, 'Apellido': e.apellido, 'Nombre': e.nombre, 'Buenas': '', 'Malas': '', 'En blanco': '', 'Nota': '', 'Estado': 'Sin presentar' };
    const g = calificar(r.respuestas, p.clave, p.escala);
    return { 'Código': e.codigo, 'Apellido': e.apellido, 'Nombre': e.nombre, 'Buenas': g.c, 'Malas': g.m, 'En blanco': g.b, 'Nota': g.nota, 'Estado': 'Calificado' };
  });
  const wb = XLSX.utils.book_new();
  const h1 = XLSX.utils.json_to_sheet(filas);
  h1['!cols'] = [{ wch: 14 }, { wch: 24 }, { wch: 24 }, { wch: 8 }, { wch: 8 }, { wch: 10 }, { wch: 7 }, { wch: 14 }];
  XLSX.utils.book_append_sheet(wb, h1, 'Resultados');
  const info = [['Prueba', p.nombre], ['Institución', p.colegio || ''], ['Docente', p.docente || ''], ['Materia', p.materia || ''], ['Curso', p.cursoNombre || ''], ['Trimestre', p.periodo || ''], ['Fecha', fechaTxt(p.fecha)], ['Preguntas', p.n], ['Nota máxima', p.escala]];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(info), 'Información');
  const cab = ['Código', 'Apellido', 'Nombre', ...Array.from({ length: p.n }, (_, i) => 'P' + (i + 1))];
  const det = [cab, ['CLAVE', '', '', ...p.clave]];
  est.forEach(e => { const r = S.resultados[e.codigo]; if (r) det.push([e.codigo, e.apellido, e.nombre, ...Array.from({ length: p.n }, (_, i) => r.respuestas[i] || '')]); });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(det), 'Respuestas');
  XLSX.writeFile(wb, `Resultados ${p.nombre.replace(/[\\/:*?"<>|]/g, '')}.xlsx`);
}

function abrirPrueba(id) {

    S.resultados = {};

    if (S.view === 'prueba' && S.pruebaId === id) { actualizarPrueba(); actualizarEstudiante(); }
  }, e => mostrarError(e));
}

  A[el.dataset.a](el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'lgPass' || e.target.id === 'lgEmail')) A.entrar();
  if (e.target.id === 'codInput') {
    const n = (S.sugLista || []).length, ul = $('#sug');
    if (e.key === 'ArrowDown' && n) { e.preventDefault(); S.sugIdx = (S.sugIdx + 1) % n; mostrarSug(); }
    else if (e.key === 'ArrowUp' && n) { e.preventDefault(); S.sugIdx = (S.sugIdx - 1 + n) % n; mostrarSug(); }
    else if (e.key === 'Enter' && ul && !ul.hidden && n) { e.preventDefault(); elegirEstudiante(S.sugLista[S.sugIdx].codigo); }
    else if (e.key === 'Escape' && ul) { ul.hidden = true; }
  }
});
document.addEventListener('input', e => {

    S.sel = null; S.sugIdx = 0;
    const pendiente = S.scan?.hojas?.length && (!S.scan.est || S.scan.asignadaDespues);
    if (S.scan && !S.scan.cargando && !pendiente) S.scan = null;
    const v = e.target.value.trim(), exacto = estudiantesPrueba().find(x => norm(x.codigo) === norm(v));

document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'cArchivo' && t.files[0]) {
    S.form.nombre = $('#cNombre').value;
    try {
      const wb = XLSX.read(await t.files[0].arrayBuffer());

      const est = filasAEstudiantes(rows);
      S.form.error = est.length ? '' : 'El archivo no tiene estudiantes reconocibles.';
      if (est.length) S.form.estudiantes = est;
    } catch (err) { S.form.error = 'No se pudo leer el archivo: ' + err.message; }
    render();
  }
  if (['pN', 'pOpt', 'pCurso', 'pFecha', 'pHoja'].includes(t.id)) { leerFormPrueba(); pintarClave(); pintarVista(); }
  if (t.id === 'scanInput' && t.files[0]) {
    const est = estudianteActual(), p = prueba(), file = t.files[0]; t.value = '';
    const sc0 = S.scan;
    const seguir = sc0?.hojas?.length && (!est || !sc0.est || sc0.est.codigo === est.codigo);
    if (!seguir) S.scan = { est: est || null, hojas: [], respuestas: new Array(p.n).fill('') };
    else if (est && !sc0.est) asignarHoja(est);
    S.scan.cargando = true; S.scan.error = ''; pintarScan();
    await new Promise(r => setTimeout(r, 30));
    try {
      const r = await leerHoja(file, p);
      const sc = S.scan;
      sc.hojas = sc.hojas.filter(h => h.off !== r.off);   // si repite una hoja, se reemplaza
      for (let i = 0; i < r.c; i++) sc.respuestas[r.off + i] = r.respuestas[i];
      sc.hojas.push(r); sc.hojas.sort((a, b) => a.off - b.off);
      redibujarHoja(r, p.clave);
    } catch (err) { S.scan.error = err.message; }
    S.scan.cargando = false;
    pintarScan();
    if (!S.scan.est && S.scan.hojas.length) { const i = $('#codInput'); i.scrollIntoView({ behavior: 'smooth', block: 'center' }); setTimeout(() => i.focus(), 300); }
  }
  if (t.id === 'scanClave' && t.files[0]) {
    leerFormPrueba(); const file = t.files[0]; t.value = '';
    $('#claveErr').textContent = 'Leyendo la hoja…';
    try {
      const r = await leerHoja(file, S.form);
      r.respuestas.forEach((x, i) => { S.form.clave[r.off + i] = x === '*' ? '' : x; });
      const pend = S.form.clave.map((x, i) => x ? 0 : i + 1).filter(Boolean);
      $('#claveErr').textContent = (r.respuestas.includes('*') ? 'Algunas preguntas tenían doble marca; complételas a mano. ' : '') +
        (pend.length && r.off + r.c < S.form.n || r.off > 0 && pend.some(q => q <= r.off) ? `Se leyeron las preguntas ${r.off + 1} a ${r.off + r.c}. Escanee también la otra hoja de la clave.` : '');
      pintarClave();
    } catch (err) { $('#claveErr').textContent = err.message; }
  }
});
